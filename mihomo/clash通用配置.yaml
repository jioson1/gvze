# 锚点
pr: &pr {type: select, proxies: [🚀 节点选择, 🌐 全部节点, ♻️ 自动选择, 🐸 手动切换1, 🐸 手动切换2, 🐸 手动切换3, 🐸 手动切换4, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, 🌐 其他地区, DIRECT], REJECT}

# 机场订阅，名称不能重复
p: &p {type: http, interval: 86400, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 1800, timeout: 5000}}
proxy-providers:
  主用: {<<: *p, url: 'https://gist.githubusercontent.com/jioson1/e68e02bc4ad3a9fd3f6b7201fd0e9608/raw/zy', override: {additional-prefix: '[zy] '}}
  备用: {<<: *p, url: 'https://gist.githubusercontent.com/jioson1/e68e02bc4ad3a9fd3f6b7201fd0e9608/raw/jlby', override: {additional-prefix: '[by] '}}

      
# 用于下载订阅时指定UA
global-ua: clash.meta
    
# 全局配置
port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
global-client-fingerprint: chrome
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
udp: true
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
external-ui-url: https://ghp.ci/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
external-ui: ui
external-ui-name: metacubexd
secret: 123456

# 自定 GEO 下载地址
geox-url:
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain: # 忽略嗅探
    - 'rule-set:cn_domain,private_domain'
    - 'Mijia Cloud'
    - '+.push.apple.com'
    - '+.wechat.com'
    - '+.qpic.cn'
    - '+.qq.com'
    - '+.wechatapp.com'
    #  语音通信
    - '+.vivox.com'
    # 向日葵服务
    - '+.oray.com'
    - '+.sunlogin.net'

tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53]

dns:
  enable: true
  ipv6: false
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: ['119.29.29.29', '180.184.1.1', '223.5.5.5']
  nameserver: ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
  fake-ip-filter:
    - "rule-set:cn_domain,private_domain,direct1"
    - "*.lan"
    - "*.local"
    - "*.home.arpa"
    - "+.gitv.tv"
    - "+.docker.io"
    - "+.miwifi.com"
    - "+.safebrowsing.apple"
    - Mijia Cloud
    #放行NTP服务
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - time1.*.com
    - time2.*.com
    - time3.*.com
    - time4.*.com
    - time5.*.com
    - time6.*.com
    - time7.*.com
    - ntp.*.com
    - ntp1.*.com
    - ntp2.*.com
    - ntp3.*.com
    - ntp4.*.com
    - ntp5.*.com
    - ntp6.*.com
    - ntp7.*.com
    - "*.time.edu.cn"
    - "*.ntp.org.cn"
    - "+.pool.ntp.org"
    - time1.cloud.tencent.com
   

# pr: &pr {type: select, proxies: [🚀 节点选择, 🌐 全部节点, ♻️ 自动选择, 🐸 手动切换1, 🐸 手动切换2, 🐸 手动切换3, 🐸 手动切换4, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, 🌐 其他地区, DIRECT], REJECT}
# 策略组
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🐸 手动切换3, 🐸 手动切换4, 🇰🇷 韩国节点, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, 🐸 手动切换1, 🐸 手动切换2, 🌐 其他地区, DIRECT]}
  - {name: 🌐 全部节点, type: select, include-all: true}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 50, interval: 600, filter: "^((?!(emby|Emby)).)*$"}
  - {name: 🐸 手动切换1, type: select, include-all: true}
  - {name: 🐸 手动切换2, type: select, include-all: true}
  - {name: 🐸 手动切换3, type: select, include-all: true}
  - {name: 🐸 手动切换4, type: select, include-all: true}
  - {name: 📹 YouTube, <<: *pr}
  - {name: 🍀 Google, <<: *pr}
  - {name: 🤖 ChatGPT, <<: *pr}
  - {name: 👨🏿‍💻 GitHub, <<: *pr}
  - {name: 🐬 OneDrive, <<: *pr}
  - {name: 🪟 Microsoft, <<: *pr}
  - {name: 🎵 TikTok, <<: *pr}
  - {name: 📲 Telegram, <<: *pr}
  - {name: 🎥 NETFLIX, <<: *pr}
  - {name: ✈️ Speedtest, <<: *pr}
  - {name: 💶 PayPal, <<: *pr}
  - {name: 🎞️ Emby专用, <<: *pr}
  - {name: 🎞 Twitter, <<: *pr}
  - {name: 🍎 Apple, type: select, proxies: [DIRECT, 🚀 节点选择]}
  - {name: 🎯 全球直连, type: select, proxies: [DIRECT, 🚀 节点选择]}
  - {name: 🎯AdBlock, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🐟 漏网之鱼, <<: *pr}

  - {name: 🇭🇰 香港节点, type: url-test, include-all: true, tolerance: 50, interval: 600, filter: "(?=.*(港|HK|(?i)Hong|home|订阅|网站|http|ex|tr|到期|套餐))^((?!(台湾|日本|新加坡|美国|韩国|狮城|南朝鲜|US|SG|JP|KR|TW|台灣|美國|韓國|獅城|3.0)).)*$"}
  - {name: 🇯🇵 日本节点, type: url-test, include-all: true, tolerance: 50, interval: 600, filter: "(?=.*(日本|JP|(?i)Japan))^((?!(香港|台湾|新加坡|美国|韩国|狮城|南朝鲜|US|SG|KR|HK|TW|台灣|美國|韓國|獅城)).)*$"}
  - {name: 🇺🇲 美国节点, type: url-test, include-all: true, tolerance: 50, interval: 600, filter: "(?=.*(美国|美國|US|洛杉矶|西雅图|(?i)States|American))^((?!(Australia|香港|台湾|日本|新加坡|韩国|狮城|南朝鲜|SG|JP|KR|HK|TW|台灣|韓國|獅城|emby|Emby)).)*$"}
  - {name: 🇹🇼 台湾节点, type: url-test, include-all: true, tolerance: 50, interval: 600, filter: "(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$"}
  - {name: 🇸🇬 新加坡节点, type: url-test, include-all: true, tolerance: 50, interval: 600, filter: "(?=.*(新加坡|狮城|SG|(?i)Singapore))^((?!(香港|台湾|日本|美国|韩国|南朝鲜|US|JP|KR|HK|TW|台灣|美國|韓國)).)*$"}
  - {name: 🇰🇷 韩国节点, type: url-test, include-all: true, tolerance: 50, interval: 600, filter: "(?=.*(KR|Korea|KOR|首尔|韩|韓|(?i)Korea))^((?!(香港|台湾|新加坡|美国|狮城|南朝鲜|US|SG|HK|TW|台灣|美國|獅城)).)*$"}
  - {name: 🌐 其他地区, type: select, include-all: true, filter: "^((?!(直连|KR|Korea|KOR|首尔|韩|韓|(?i)Korea|台|TW|(?i)Taiwan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|(?i)United States|新加坡|狮城|SG|(?i)Singapore|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|(?i)Japan|港|HK|(?i)Hong|home|订阅|网站|http|ex|tr)).)*$"}
  
rules:
  - DOMAIN,emby.aca.best,🎞️ Emby专用
  - DOMAIN,aca.misakaf.org,🎞️ Emby专用
  - DOMAIN-SUFFIX,rren.top,🇸🇬 新加坡节点
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,direct1,DIRECT
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,itunes_domain,🍎 Apple

  - RULE-SET,ai,🤖 ChatGPT
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,Twitter,🎞 Twitter
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft,🪟 Microsoft
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,speedtest_domain,✈️ Speedtest
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,netflix_ip,🎥 NETFLIX
  - RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,geolocation-!cn,🚀 节点选择
  - RULE-SET,proxy,🚀 节点选择 
  - RULE-SET,cn_domain,🎯 全球直连
  - RULE-SET,cn_ip,🎯 全球直连
  - RULE-SET,AdBlock,🎯AdBlock
  - MATCH,🐟 漏网之鱼

rule-anchor:
  #ip
  ip: &ip {type: http, interval: 604800, behavior: ipcidr, format: mrs}
  #域名
  domain: &domain {type: http, interval: 604800, behavior: domain, format: mrs}
  #+.域名
  qcy: &qcy {type: http, interval: 604800, behavior: domain, format: text}
  #list传统域名
  class: &class {type: http, interval: 604800, behavior: classical, format: text}
  #list传统ip
  ipi: &ipi {type: http, interval: 604800, behavior: ipcidr, format: text}
  #yaml格式域名
  yaml: &yaml {type: http, interval: 604800, behavior: classical, format: yaml}

